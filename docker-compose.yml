services:
  patrol-api:
    build: .
    image: patrol-zone-api:latest
    container_name: patrol-zone-api
    restart: unless-stopped
    environment:
      # 相邻定位点允许的最大采样间隔（秒），超过则该段输出为“未覆盖时段”
      MAX_GAP_SECONDS: "60"
      DB_PATH: /data/patrol.db
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - patrol-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  patrol-data:
